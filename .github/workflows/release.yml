name: Release

# A pushed tag like v0.2.0 (script/release makes one) builds the installers and publishes them as
# a GitHub release. Run by hand, it builds them only, to download from the run's artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number counts commits
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Optional: a Developer ID certificate, exported as .p12 and base64-encoded, in the
      # MACOS_CERTIFICATE secret. Without it the app is signed ad hoc.
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No certificate: the app is signed ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: Build the disk image
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: script/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/dist/*.dmg*

  # Built on Arch, the target platform, so it needs a current glibc.
  linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system packages
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@v4
      - run: script/linux-deps
      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build the archive
        run: script/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/dist/*.tar.gz*

  publish:
    if: github.ref_type == 'tag'
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Gleipnir ${GITHUB_REF_NAME#v}" --generate-notes $prerelease
