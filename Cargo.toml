[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# GPUI moves quickly and the crates.io release is a year behind, so pin one Zed commit.
gpui = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", default-features = false, features = ["font-kit"] }
# `wayland` and `x11` only take effect on Linux. On macOS, `runtime_shaders` means building doesn't
# need Apple's Metal Toolchain.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }

gleipnir-agent = { path = "crates/agent" }
gleipnir-code-nav = { path = "crates/code_nav" }
gleipnir-core = { path = "crates/core" }
gleipnir-dap = { path = "crates/dap" }
gleipnir-debugger-ui = { path = "crates/debugger_ui" }
gleipnir-editor = { path = "crates/editor" }
gleipnir-index = { path = "crates/index" }
gleipnir-lsp = { path = "crates/lsp" }
gleipnir-packages = { path = "crates/packages" }
gleipnir-project-panel = { path = "crates/project_panel" }
gleipnir-search = { path = "crates/search" }
gleipnir-settings-ui = { path = "crates/settings_ui" }
gleipnir-git-ui = { path = "crates/git_ui" }
gleipnir-suggest = { path = "crates/suggest" }
gleipnir-syntax = { path = "crates/syntax" }
gleipnir-terminal = { path = "crates/terminal" }
gleipnir-text = { path = "crates/text" }
gleipnir-ui = { path = "crates/ui" }
gleipnir-updater = { path = "crates/updater" }
gleipnir-workspace = { path = "crates/workspace" }

anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
