<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400">
  <!-- The disk image's window. Finder puts Gleipnir at (165, 180) and Applications at (495, 180). -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f4"/>
      <stop offset="1" stop-color="#efe9dd"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9b85c"/>
      <stop offset="1" stop-color="#c9822a"/>
    </linearGradient>
  </defs>
  <rect width="660" height="400" fill="url(#paper)"/>
  <!-- The arrow, from the app to Applications. -->
  <path d="M 262 180 C 310 150, 350 150, 386 172" fill="none" stroke="url(#silk)"
        stroke-width="5" stroke-linecap="round" stroke-dasharray="1 12"/>
  <path d="M 383.3 182.4 L 402.2 182.4 L 393.9 165.4" fill="none" stroke="#c9822a" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="330" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial"
        font-size="15" fill="#6b6f78">Drag Gleipnir into Applications to install it</text>
</svg>
