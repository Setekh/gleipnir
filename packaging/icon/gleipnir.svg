<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3140"/>
      <stop offset="1" stop-color="#151920"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3a3"/>
      <stop offset="0.5" stop-color="#f2b84b"/>
      <stop offset="1" stop-color="#c9822a"/>
    </linearGradient>
    <linearGradient id="silk2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1cc"/>
      <stop offset="1" stop-color="#e2a446"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
  <!-- The G: a ribbon round, open at the upper right, its end turned in. -->
  <path d="M 700 330 A 250 250 0 1 0 762 512 L 540 512"
        fill="none" stroke="url(#silk)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The binding: a silk band wound twice round the G's side. -->
  <g stroke-linecap="round" fill="none">
    <path d="M 210 448 Q 262 472 338 446" stroke="#151920" stroke-width="54"/>
    <path d="M 210 448 Q 262 472 338 446" stroke="url(#silk2)" stroke-width="26"/>
    <path d="M 206 540 Q 260 564 336 538" stroke="#151920" stroke-width="54"/>
    <path d="M 206 540 Q 260 564 336 538" stroke="url(#silk2)" stroke-width="26"/>
  </g>
</svg>
