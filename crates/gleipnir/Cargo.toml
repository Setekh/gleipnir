[package]
name = "gleipnir"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Lets the test driver's `screenshot` command read rendered frames back, which GPUI only supports
# with its test support compiled in. Not for normal builds.
capture = ["gpui/test-support", "gpui_platform/test-support", "dep:image"]

[dependencies]
anyhow.workspace = true
gleipnir-agent.workspace = true
gleipnir-code-nav.workspace = true
gleipnir-core.workspace = true
gleipnir-debugger-ui.workspace = true
gleipnir-editor.workspace = true
gleipnir-project-panel.workspace = true
gleipnir-packages.workspace = true
gleipnir-search.workspace = true
gleipnir-settings-ui.workspace = true
gleipnir-git-ui.workspace = true
gleipnir-terminal.workspace = true
gleipnir-suggest.workspace = true
gleipnir-syntax.workspace = true
gleipnir-ui.workspace = true
gleipnir-workspace.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
