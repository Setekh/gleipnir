# Markdown, with Marksman: links between documents and to headings, their completion and
# renaming, and broken links as problems.
[package]
id = "markdown"
name = "Markdown"
version = "0.1.0"

[[language]]
name = "Markdown"
grammar = "markdown"
extensions = ["md", "markdown"]
block_comment = ["<!--", "-->"]
tab_size = 2
# No quotes: prose is full of apostrophes.
pairs = ["()", "[]", "``"]

[server]
tool = "marksman"
args = ["server"]

[tool.marksman]
binary = "marksman"

[tool.marksman.install]
kind = "download"
version = "2026-02-08"
binary = "marksman"
